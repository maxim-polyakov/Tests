name: Deploy WrightTest

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - e2e/**
      - k8s/**
      - misa-tests/**
      - gallery-tests/**
      - ecommerce-tests/**
      - businesscard-tests/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: wrighttest-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package deployment files
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ENV" || { echo 'DEPLOY_ENV secret is empty'; exit 1; }
          printf '%s\n' "$DEPLOY_ENV" > .env
          tar -czf wrighttest-deploy.tar.gz compose.yaml .env e2e k8s misa-tests gallery-tests ecommerce-tests businesscard-tests scripts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            wrighttest-deploy.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/wrighttest-deploy-${GITHUB_SHA}.tar.gz"

      - name: Deploy WrightTest to Kubernetes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             mkdir -p '$DEPLOY_PATH'
             tar -xzf '/tmp/wrighttest-deploy-${GITHUB_SHA}.tar.gz' -C '$DEPLOY_PATH'
             rm '/tmp/wrighttest-deploy-${GITHUB_SHA}.tar.gz'
             cd '$DEPLOY_PATH'
             if docker compose version >/dev/null 2>&1; then
               COMPOSE='docker compose'
             else
               COMPOSE='docker-compose'
             fi
             \$COMPOSE pull
             kubectl apply -f k8s/namespace.yaml
             kubectl -n wrighttest create secret generic wrighttest-env \
               --from-env-file=.env \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest create configmap wrighttest-importer-script \
               --from-file=import-tests.mjs=scripts/import-tests.mjs \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest create configmap wrighttest-misa-tests \
               --from-file=misa-tests \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest delete configmap wrighttest-tests --ignore-not-found
             kubectl -n wrighttest create configmap wrighttest-gallery-tests \
               --from-file=gallery-tests \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest create configmap wrighttest-ecommerce-tests \
               --from-file=ecommerce-tests \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest create configmap wrighttest-businesscard-tests \
               --from-file=businesscard-tests \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest delete job test-importer --ignore-not-found
             kubectl -n wrighttest delete job misagallery-test-importer --ignore-not-found
             kubectl -n wrighttest delete job ecommerce-test-importer --ignore-not-found
             kubectl -n wrighttest delete job businesscard-test-importer --ignore-not-found
             kubectl apply -f k8s/resources.yaml
             kubectl apply -f k8s/e2e-cronjob.yaml
             kubectl apply -f k8s/gallery-e2e-cronjob.yaml
             kubectl apply -f k8s/ecommerce-e2e-cronjob.yaml
             kubectl apply -f k8s/businesscard-e2e-cronjob.yaml
             stdbuf -oL -eL bash '$DEPLOY_PATH/scripts/compose-k3s-sync.sh' \
               --compose-file compose.yaml \
               --project-dir '$DEPLOY_PATH' \
               --project-name wrighttest \
               --skip-build \
               --timeout 15m
             kubectl -n wrighttest rollout status deployment/redis --timeout=180s
             kubectl -n wrighttest rollout status deployment/novnc --timeout=180s
             kubectl -n wrighttest rollout status deployment/backend --timeout=300s
             kubectl -n wrighttest rollout status deployment/frontend --timeout=180s
             kubectl -n wrighttest delete pod wrighttest-e2e-sync --ignore-not-found --wait=true
             kubectl -n wrighttest run wrighttest-e2e-sync \
               --image=busybox:1.37 \
               --restart=Never \
               --overrides='{\"apiVersion\":\"v1\",\"spec\":{\"nodeSelector\":{\"baxic.ru/workload-pool\":\"main\"},\"affinity\":{\"podAffinity\":{\"requiredDuringSchedulingIgnoredDuringExecution\":[{\"labelSelector\":{\"matchLabels\":{\"app\":\"novnc\"}},\"topologyKey\":\"kubernetes.io/hostname\"}]}},\"containers\":[{\"name\":\"wrighttest-e2e-sync\",\"image\":\"busybox:1.37\",\"command\":[\"sleep\",\"600\"],\"volumeMounts\":[{\"name\":\"wrighttest-data\",\"mountPath\":\"/data\"}]}],\"volumes\":[{\"name\":\"wrighttest-data\",\"persistentVolumeClaim\":{\"claimName\":\"wrighttest-data\"}}]}}'
             kubectl -n wrighttest wait --for=condition=Ready pod/wrighttest-e2e-sync --timeout=180s
             kubectl -n wrighttest exec wrighttest-e2e-sync -- sh -c 'rm -rf /data/e2e && mkdir -p /data/e2e'
             kubectl -n wrighttest cp e2e/. wrighttest-e2e-sync:/data/e2e
             kubectl -n wrighttest delete pod wrighttest-e2e-sync --wait=true
             if ! kubectl -n wrighttest wait --for=condition=complete job/test-importer --timeout=300s; then
               kubectl -n wrighttest describe job/test-importer || true
               kubectl -n wrighttest logs job/test-importer --all-containers=true --tail=-1 || true
               exit 1
             fi
             if ! kubectl -n wrighttest wait --for=condition=complete job/misagallery-test-importer --timeout=300s; then
               kubectl -n wrighttest describe job/misagallery-test-importer || true
               kubectl -n wrighttest logs job/misagallery-test-importer --all-containers=true --tail=-1 || true
               exit 1
             fi
             if ! kubectl -n wrighttest wait --for=condition=complete job/ecommerce-test-importer --timeout=300s; then
               kubectl -n wrighttest describe job/ecommerce-test-importer || true
               kubectl -n wrighttest logs job/ecommerce-test-importer --all-containers=true --tail=-1 || true
               exit 1
             fi
             if ! kubectl -n wrighttest wait --for=condition=complete job/businesscard-test-importer --timeout=300s; then
               kubectl -n wrighttest describe job/businesscard-test-importer || true
               kubectl -n wrighttest logs job/businesscard-test-importer --all-containers=true --tail=-1 || true
               exit 1
             fi
             kubectl -n wrighttest get pods -o wide"
