name: Deploy WrightTest

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - k8s/**
      - tests/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: wrighttest-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package deployment files
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ENV" || { echo 'DEPLOY_ENV secret is empty'; exit 1; }
          printf '%s\n' "$DEPLOY_ENV" > .env
          tar -czf wrighttest-deploy.tar.gz compose.yaml .env k8s tests scripts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp \
            -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            wrighttest-deploy.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/wrighttest-deploy-${GITHUB_SHA}.tar.gz"

      - name: Deploy WrightTest to Kubernetes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             mkdir -p '$DEPLOY_PATH'
             tar -xzf '/tmp/wrighttest-deploy-${GITHUB_SHA}.tar.gz' -C '$DEPLOY_PATH'
             rm '/tmp/wrighttest-deploy-${GITHUB_SHA}.tar.gz'
             cd '$DEPLOY_PATH'
             if docker compose version >/dev/null 2>&1; then
               COMPOSE='docker compose'
             else
               COMPOSE='docker-compose'
             fi
             \$COMPOSE pull
             kubectl apply -f k8s/namespace.yaml
             kubectl -n wrighttest create secret generic wrighttest-env \
               --from-env-file=.env \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest create configmap wrighttest-importer-script \
               --from-file=import-tests.mjs=scripts/import-tests.mjs \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest create configmap wrighttest-tests \
               --from-file=tests \
               --dry-run=client -o yaml | kubectl apply -f -
             kubectl -n wrighttest delete job test-importer --ignore-not-found
             kubectl apply -f k8s/resources.yaml
             stdbuf -oL -eL bash "$DEPLOY_PATH/scripts/compose-k3s-sync.sh" \
              --compose-file compose.yaml \

               --project-dir '$DEPLOY_PATH' \
               --project-name wrighttest \
               --skip-build \
               --timeout 15m
             kubectl -n wrighttest rollout status deployment/redis --timeout=180s
             kubectl -n wrighttest rollout status deployment/novnc --timeout=180s
             kubectl -n wrighttest rollout status deployment/backend --timeout=300s
             kubectl -n wrighttest rollout status deployment/frontend --timeout=180s
             kubectl -n wrighttest wait --for=condition=complete job/test-importer --timeout=300s
             kubectl -n wrighttest get pods -o wide"
