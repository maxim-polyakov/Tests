apiVersion: batch/v1
kind: Job
metadata:
  name: test-importer
  namespace: wrighttest
  labels:
    app: test-importer
    compose.project: wrighttest
    compose.service: test-importer
    migrate.from: docker
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: test-importer
        compose.project: wrighttest
        compose.service: test-importer
        migrate.from: docker
    spec:
      restartPolicy: Never
      nodeSelector:
        baxic.ru/workload-pool: main
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      initContainers:
        - name: wait-for-backend
          image: node:22-alpine
          command:
            - node
            - -e
            - >-
              const wait = async () => {
                for (;;) {
                  try {
                    const response = await fetch('http://backend:3000/health');
                    if (response.ok) process.exit(0);
                  } catch {}
                  await new Promise(resolve => setTimeout(resolve, 3000));
                }
              };
              wait();
      containers:
        - name: test-importer
          image: node:22-alpine
          command: ["node", "/import-tests.mjs"]
          env:
            - name: WRIGHTTEST_API_URL
              value: http://backend:3000
            - name: WRIGHTTEST_PROJECT
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: WRIGHTTEST_PROJECT
            - name: TEST_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: TEST_BASE_URL
                  optional: true
            - name: TEST_SCHEDULE_CRON
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: TEST_SCHEDULE_CRON
                  optional: true
            - name: TEST_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: TEST_ENVIRONMENT
                  optional: true
            - name: MISA_TEST_EMAIL
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: MISA_TEST_EMAIL
            - name: MISA_TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: MISA_TEST_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wrighttest-env
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: importer-script
              mountPath: /import-tests.mjs
              subPath: import-tests.mjs
              readOnly: true
            - name: misa-tests
              mountPath: /misa-tests
              readOnly: true
      volumes:
        - name: importer-script
          configMap:
            name: wrighttest-importer-script
        - name: misa-tests
          configMap:
            name: wrighttest-misa-tests
---
