apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wrighttest
  labels:
    compose.project: wrighttest
    compose.service: frontend
    migrate.from: docker
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: frontend
      nodePort: 30717
