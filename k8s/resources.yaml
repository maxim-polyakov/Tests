apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: wrighttest
  labels:
    app: redis
    compose.project: wrighttest
    compose.service: redis
    migrate.from: docker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        compose.project: wrighttest
        compose.service: redis
        migrate.from: docker
    spec:
      nodeSelector:
        baxic.ru/workload-pool: main
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wrighttest-data
  namespace: wrighttest
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wrighttest
  labels:
    compose.project: wrighttest
    compose.service: redis
    migrate.from: docker
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novnc
  namespace: wrighttest
  labels:
    app: novnc
    compose.project: wrighttest
    compose.service: novnc
    migrate.from: docker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: novnc
  template:
    metadata:
      labels:
        app: novnc
        compose.project: wrighttest
        compose.service: novnc
        migrate.from: docker
    spec:
      nodeSelector:
        baxic.ru/workload-pool: main
        kubernetes.io/hostname: worker-146
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      initContainers:
        - name: prepare-shared-data
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/x11"]
          volumeMounts:
            - name: wrighttest-data
              mountPath: /data
      containers:
        - name: novnc
          image: sacha1bu/wrighttest-novnc:0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: VNC_PORT
              value: "5900"
            - name: NOVNC_PORT
              value: "6080"
          ports:
            - name: novnc
              containerPort: 6080
          readinessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: wrighttest-data
              mountPath: /tmp/.X11-unix
              subPath: x11
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: wrighttest-data
          persistentVolumeClaim:
            claimName: wrighttest-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: novnc
  namespace: wrighttest
  labels:
    compose.project: wrighttest
    compose.service: novnc
    migrate.from: docker
spec:
  type: NodePort
  selector:
    app: novnc
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
      nodePort: 31920
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wrighttest
  labels:
    app: backend
    compose.project: wrighttest
    compose.service: backend
    migrate.from: docker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        compose.project: wrighttest
        compose.service: backend
        migrate.from: docker
    spec:
      nodeSelector:
        baxic.ru/workload-pool: main
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: novnc
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: prepare-shared-data
          image: busybox:1.37
          command:
            - sh
            - -c
            - mkdir -p /data/screenshots /data/traces /data/auth-states /data/x11
          volumeMounts:
            - name: wrighttest-data
              mountPath: /data
      hostAliases:
        - ip: 89.124.86.173
          hostnames:
            - host.docker.internal
      containers:
        - name: backend
          image: sacha1bu/wrighttest-backend:0.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - >-
              cd backend &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');const shot='test.name.startsWith(\"misa-advertising\") || index === steps.length - 1 || stepError';s=s.replaceAll('await locator.waitFor({ timeout: 10000 });','await page.addStyleTag({ content: \"*{animation:none!important;transition:none!important}\" }).catch(() => {}); const waitTimeout = step.options?.timeout ?? 10000; if (!step.options?.exact) { await locator.waitFor({ state: \"visible\", timeout: waitTimeout }); break; } await page.waitForFunction(() => Object.keys(localStorage).filter((key) => key.startsWith(\"chats_\")).some((key) => { try { const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const message = chats?.[0]?.messages?.at(-1); return message && message.user !== \"Misa\" && message.deliveryStatus === \"sent\"; } catch { return false; } }), null, { timeout: 15000 }); await new Promise((resolve) => setTimeout(resolve, 1000)); const delivery = await page.evaluate(() => { const key = Object.keys(localStorage).find((item) => item.startsWith(\"chats_\")); const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const resource = performance.getEntriesByType(\"resource\").map((entry) => entry.name).find((url) => url.includes(\"/api/chats/\")); return { chatId: chats?.[0]?.id, token: localStorage.getItem(\"token\"), apiBase: resource ? new URL(resource).origin : null }; }); if (!delivery.chatId || !delivery.token || !delivery.apiBase) throw new Error(\"Misa delivery metadata is unavailable\"); const chatUrl = page.url(); const deadline = Date.now() + waitTimeout; let answered = false; await page.goto(\"about:blank\"); while (Date.now() < deadline) { await new Promise((resolve) => setTimeout(resolve, Math.min(2000, Math.max(0, deadline - Date.now())))); try { const response = await fetch(delivery.apiBase + \"/api/chats/\" + encodeURIComponent(delivery.chatId) + \"/messages/\", { headers: { Authorization: \"Bearer \" + delivery.token } }); const payload = response.ok ? await response.json() : null; const messages = Array.isArray(payload?.data) ? payload.data : []; if (messages.some((message) => message.user === \"Misa\")) { answered = true; break; } } catch {} } if (!answered) throw new Error(\"waitForSelector timed out after \" + waitTimeout + \"ms\"); await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 10000 });').replaceAll('await page.screenshot({ path: screenshotPath });','if ('+shot+') await page.screenshot({ path: screenshotPath, animations: \"disabled\", timeout: 10000 });').replaceAll('screenshots.push(screenshotName);','if ('+shot+') screenshots.push(screenshotName);').replaceAll('screenshot: screenshots[screenshots.length - 1] ?? null','screenshot: ('+shot+') ? screenshots[screenshots.length - 1] ?? null : null').replaceAll('let answered = false; await page.goto','let answered = false; let answerMessages = []; await page.goto').replaceAll('answered = true; break;','answered = true; answerMessages = messages; break;').replaceAll('await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 10000 });','await page.addInitScript(({ chatId, messages }) => { const key = Object.keys(localStorage).find((item) => item.startsWith(\"chats_\")); const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const index = chats.findIndex((chat) => chat.id === chatId); if (index >= 0) { const chat = { ...chats[index], messages, _messagesLoaded: true }; chats.splice(index, 1); chats.unshift(chat); localStorage.setItem(key, JSON.stringify(chats)); } }, { chatId: delivery.chatId, messages: answerMessages }); await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 5000 });');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('test.name.startsWith(\"misa-advertising\") || index === steps.length - 1 || stepError','index === steps.length - 1 || stepError');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('answered = true; answerMessages = messages; break;','answered = true; answerMessages = messages; await new Promise((resolve) => setTimeout(resolve, Math.min(8500, Math.max(0, deadline - Date.now())))); try { const finalResponse = await fetch(delivery.apiBase + \"/api/chats/\" + encodeURIComponent(delivery.chatId) + \"/messages/\", { headers: { Authorization: \"Bearer \" + delivery.token } }); const finalPayload = finalResponse.ok ? await finalResponse.json() : null; const finalMessages = Array.isArray(finalPayload?.data) ? finalPayload.data : []; if (finalMessages.some((message) => message.user === \"Misa\")) answerMessages = finalMessages; } catch {} break;');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('messages.some((message) => message.user === \"Misa\")','messages.some((message) => message.user === \"Misa\" && message.adsComplete !== false)').replaceAll('Math.min(2000, Math.max(0, deadline - Date.now()))','Math.min(500, Math.max(0, deadline - Date.now()))').replaceAll('Math.min(8500, Math.max(0, deadline - Date.now()))','Math.min(0, Math.max(0, deadline - Date.now()))');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('await context.tracing.start({ screenshots: true, snapshots: true, sources: true });','if (!test.name.startsWith(\"misa-advertising\")) await context.tracing.start({ screenshots: true, snapshots: true, sources: true });').replaceAll('traceStarted = true;','traceStarted = !test.name.startsWith(\"misa-advertising\");');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replace('async function runTest(job) {','let misaAuthState = null; let misaAuthStateAt = 0;\nasync function runTest(job) {').replace('context = await browser.newContext({\n            ...deviceConfig\n        });','let useMisaAuthCache = test.name.startsWith(\"misa-advertising\") && misaAuthState && Date.now() - misaAuthStateAt < 600000; context = await browser.newContext({ ...deviceConfig, ...(useMisaAuthCache ? { storageState: misaAuthState } : {}) });').replace('const page = await context.newPage();','const page = await context.newPage(); if (useMisaAuthCache) { await page.goto(steps[4].expected, { waitUntil: \"domcontentloaded\" }); const validCachedAuth = await page.locator(\".chat-container\").waitFor({ state: \"visible\", timeout: 5000 }).then(() => true).catch(() => false); if (!validCachedAuth) { useMisaAuthCache = false; misaAuthState = null; } }').replace('for (const [index, step] of steps.entries()) {','for (const [index, step] of steps.entries()) { if (!useMisaAuthCache && test.name.startsWith(\"misa-advertising\") && index === 6) { misaAuthState = await context.storageState(); misaAuthStateAt = Date.now(); } if (useMisaAuthCache && index < 6) continue;');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/utils/runtime-variables.js';let s=fs.readFileSync(p,'utf8');if(s.includes('AD_PROMPT_SMARTPHONE'))process.exit(0);const needle='return {\n        ...environmentVariables,\n        ...dataCaseVariables\n    };';const next=['const fs=require(\"fs\");','const pool=JSON.parse(fs.readFileSync(\"/ad-prompt-pool.json\",\"utf8\"));','const pick=a=>a[Math.floor(Math.random()*a.length)];','    return {','        ...environmentVariables,','        ...dataCaseVariables,','        AD_PROMPT_SMARTPHONE: pick(pool.AD_PROMPT_SMARTPHONE),','        AD_PROMPT_CAR: pick(pool.AD_PROMPT_CAR),','        AD_PROMPT_COURSE: pick(pool.AD_PROMPT_COURSE),','        AD_PROMPT_FOOD: pick(pool.AD_PROMPT_FOOD),','        AD_PROMPT_HOTEL: pick(pool.AD_PROMPT_HOTEL)','    };'].join('\n');if(!s.includes(needle))throw new Error('runtime-variables merge site not found');fs.writeFileSync(p,s.replace(needle,next));" &&
              npx prisma migrate deploy &&
              npx prisma db seed &&
              node dist/src/index.js
          envFrom:
            - secretRef:
                name: wrighttest-env
          env:
            - name: BACKEND_PORT
              value: "3000"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: FRONTEND_INTERNAL_URL
              value: http://frontend
            - name: SCREENSHOTS_DIR
              value: /app/backend/screenshots
            - name: TRACES_DIR
              value: /app/backend/traces
            - name: AUTH_STATES_DIR
              value: /app/backend/auth-states
            - name: DISPLAY
              value: ":99"
            - name: NOVNC_HOST
              value: novnc
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: --require=/app/backend/wrighttest-popup-screenshot.cjs
            - name: TEST_WORKER_CONCURRENCY
              value: "1"
          # LimitedSwap: 4Gi request ~15Gi swap so memory.high=3Gi can reclaim into swap
          # without stalling probes (256Mi request left only ~1Gi swap and backend went NotReady).
          resources:
            requests:
              cpu: 50m
              memory: 4Gi
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    CG=$(awk -F: 'NR==1 { print $NF }' /proc/self/cgroup)
                    HIGH=$((3 * 1024 * 1024 * 1024))
                    for p in "/host-cgroup${CG}/memory.high" "/host-cgroup${CG}/../memory.high"; do
                      if [ -e "$p" ]; then
                        echo "$HIGH" > "$p" || true
                        break
                      fi
                    done
          ports:
            - name: backend
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: backend
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/db
              port: backend
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: wrighttest-data
              mountPath: /app/backend/screenshots
              subPath: screenshots
            - name: wrighttest-data
              mountPath: /app/backend/traces
              subPath: traces
            - name: wrighttest-data
              mountPath: /app/backend/auth-states
              subPath: auth-states
            - name: wrighttest-data
              mountPath: /tmp/.X11-unix
              subPath: x11
            - name: shm
              mountPath: /dev/shm
            - name: popup-screenshot
              mountPath: /app/backend/wrighttest-popup-screenshot.cjs
              subPath: wrighttest-popup-screenshot.cjs
              readOnly: true
            - name: ad-prompt-pool
              mountPath: /ad-prompt-pool.json
              subPath: ad-prompt-pool.json
              readOnly: true
            - name: host-cgroup
              mountPath: /host-cgroup
      volumes:
        - name: wrighttest-data
          persistentVolumeClaim:
            claimName: wrighttest-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: popup-screenshot
          configMap:
            name: wrighttest-popup-screenshot
        - name: ad-prompt-pool
          configMap:
            name: wrighttest-ad-prompt-pool
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wrighttest
  labels:
    compose.project: wrighttest
    compose.service: backend
    migrate.from: docker
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: backend
      port: 3000
      targetPort: backend
      nodePort: 31203
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wrighttest
  labels:
    app: frontend
    compose.project: wrighttest
    compose.service: frontend
    migrate.from: docker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        compose.project: wrighttest
        compose.service: frontend
        migrate.from: docker
    spec:
      nodeSelector:
        baxic.ru/workload-pool: main
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      containers:
        - name: frontend
          image: sacha1bu/wrighttest-frontend:0.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wrighttest-env
          env:
            - name: VITE_ENABLE_NOVNC
              value: "true"
          ports:
            - name: frontend
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: frontend
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
