apiVersion: apps/v1
kind: Deployment
metadata:
  name: novnc
  namespace: wrighttest
  labels:
    app: novnc
    compose.project: wrighttest
    compose.service: novnc
    migrate.from: docker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: novnc
  template:
    metadata:
      labels:
        app: novnc
        compose.project: wrighttest
        compose.service: novnc
        migrate.from: docker
    spec:
      nodeSelector:
        baxic.ru/workload-pool: main
        kubernetes.io/hostname: worker-146
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      initContainers:
        - name: prepare-shared-data
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/x11"]
          volumeMounts:
            - name: wrighttest-data
              mountPath: /data
      containers:
        - name: novnc
          image: sacha1bu/wrighttest-novnc:0.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: VNC_PORT
              value: "5900"
            - name: NOVNC_PORT
              value: "6080"
          ports:
            - name: novnc
              containerPort: 6080
          readinessProbe:
            httpGet:
              path: /vnc.html
              port: novnc
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: wrighttest-data
              mountPath: /tmp/.X11-unix
              subPath: x11
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: wrighttest-data
          persistentVolumeClaim:
            claimName: wrighttest-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
