  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        compose.project: wrighttest
        compose.service: backend
        migrate.from: docker
    spec:
      nodeSelector:
        baxic.ru/workload-pool: main
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 120
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: novnc
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: prepare-shared-data
          image: busybox:1.37
          command:
            - sh
            - -c
            - mkdir -p /data/screenshots /data/traces /data/auth-states /data/x11
          volumeMounts:
            - name: wrighttest-data
              mountPath: /data
      hostAliases:
        - ip: 89.124.86.173
          hostnames:
            - host.docker.internal
      containers:
        - name: backend
          image: sacha1bu/wrighttest-backend:0.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - >-
              cd backend &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');const shot='test.name.startsWith(\"misa-advertising\") || index === steps.length - 1 || stepError';s=s.replaceAll('await locator.waitFor({ timeout: 10000 });','await page.addStyleTag({ content: \"*{animation:none!important;transition:none!important}\" }).catch(() => {}); const waitTimeout = step.options?.timeout ?? 10000; if (!step.options?.exact) { await locator.waitFor({ state: \"visible\", timeout: waitTimeout }); break; } await page.waitForFunction(() => Object.keys(localStorage).filter((key) => key.startsWith(\"chats_\")).some((key) => { try { const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const message = chats?.[0]?.messages?.at(-1); return message && message.user !== \"Misa\" && message.deliveryStatus === \"sent\"; } catch { return false; } }), null, { timeout: 15000 }); await new Promise((resolve) => setTimeout(resolve, 1000)); const delivery = await page.evaluate(() => { const key = Object.keys(localStorage).find((item) => item.startsWith(\"chats_\")); const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const resource = performance.getEntriesByType(\"resource\").map((entry) => entry.name).find((url) => url.includes(\"/api/chats/\")); return { chatId: chats?.[0]?.id, token: localStorage.getItem(\"token\"), apiBase: resource ? new URL(resource).origin : null }; }); if (!delivery.chatId || !delivery.token || !delivery.apiBase) throw new Error(\"Misa delivery metadata is unavailable\"); const chatUrl = page.url(); const deadline = Date.now() + waitTimeout; let answered = false; await page.goto(\"about:blank\"); while (Date.now() < deadline) { await new Promise((resolve) => setTimeout(resolve, Math.min(2000, Math.max(0, deadline - Date.now())))); try { const response = await fetch(delivery.apiBase + \"/api/chats/\" + encodeURIComponent(delivery.chatId) + \"/messages/\", { headers: { Authorization: \"Bearer \" + delivery.token } }); const payload = response.ok ? await response.json() : null; const messages = Array.isArray(payload?.data) ? payload.data : []; if (messages.some((message) => message.user === \"Misa\")) { answered = true; break; } } catch {} } if (!answered) throw new Error(\"waitForSelector timed out after \" + waitTimeout + \"ms\"); await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 10000 });').replaceAll('await page.screenshot({ path: screenshotPath });','if ('+shot+') await page.screenshot({ path: screenshotPath, animations: \"disabled\", timeout: 10000 });').replaceAll('screenshots.push(screenshotName);','if ('+shot+') screenshots.push(screenshotName);').replaceAll('screenshot: screenshots[screenshots.length - 1] ?? null','screenshot: ('+shot+') ? screenshots[screenshots.length - 1] ?? null : null').replaceAll('let answered = false; await page.goto','let answered = false; let answerMessages = []; await page.goto').replaceAll('answered = true; break;','answered = true; answerMessages = messages; break;').replaceAll('await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 10000 });','await page.addInitScript(({ chatId, messages }) => { const key = Object.keys(localStorage).find((item) => item.startsWith(\"chats_\")); const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const index = chats.findIndex((chat) => chat.id === chatId); if (index >= 0) { const chat = { ...chats[index], messages, _messagesLoaded: true }; chats.splice(index, 1); chats.unshift(chat); localStorage.setItem(key, JSON.stringify(chats)); } }, { chatId: delivery.chatId, messages: answerMessages }); await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 5000 });');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('test.name.startsWith(\"misa-advertising\") || index === steps.length - 1 || stepError','index === steps.length - 1 || stepError');fs.writeFileSync(p,s)" &&
              node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');s=s.replaceAll('answered = true; answerMessages = messages; break;','answered = true; answerMessages = messages; await new Promise((resolve) => setTimeout(resolve, Math.min(8500, Math.max(0, deadline - Date.now())))); try { const finalResponse = await fetch(delivery.apiBase + \"/api/chats/\" + encodeURIComponent(delivery.chatId) + \"/messages/\", { headers: { Authorization: \"Bearer \" + delivery.token } }); const finalPayload = finalResponse.ok ? await finalResponse.json() : null; const finalMessages = Array.isArray(finalPayload?.data) ? finalPayload.data : []; if (finalMessages.some((message) => message.user === \"Misa\")) answerMessages = finalMessages; } catch {} break;');fs.writeFileSync(p,s)" &&
              npx prisma migrate deploy &&
              npx prisma db seed &&
              node dist/src/index.js
          envFrom:
            - secretRef:
                name: wrighttest-env
          env:
            - name: BACKEND_PORT
              value: "3000"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: FRONTEND_INTERNAL_URL
              value: http://frontend
            - name: SCREENSHOTS_DIR
              value: /app/backend/screenshots
            - name: TRACES_DIR
              value: /app/backend/traces
            - name: AUTH_STATES_DIR
              value: /app/backend/auth-states
            - name: DISPLAY
              value: ":99"
            - name: NOVNC_HOST
              value: novnc
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: --require=/app/backend/wrighttest-popup-screenshot.cjs
            - name: TEST_WORKER_CONCURRENCY
              value: "1"
          ports:
            - name: backend
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: backend
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/db
              port: backend
            periodSeconds: 10
          volumeMounts:
            - name: wrighttest-data
              mountPath: /app/backend/screenshots
              subPath: screenshots
            - name: wrighttest-data
              mountPath: /app/backend/traces
              subPath: traces
            - name: wrighttest-data
              mountPath: /app/backend/auth-states
              subPath: auth-states
            - name: wrighttest-data
              mountPath: /tmp/.X11-unix
              subPath: x11
            - name: shm
              mountPath: /dev/shm
            - name: popup-screenshot
              mountPath: /app/backend/wrighttest-popup-screenshot.cjs
              subPath: wrighttest-popup-screenshot.cjs
              readOnly: true
      volumes:
        - name: wrighttest-data
          persistentVolumeClaim:
            claimName: wrighttest-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: popup-screenshot
          configMap:
            name: wrighttest-popup-screenshot
