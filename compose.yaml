services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  novnc:
    image: sacha1bu/wrighttest-novnc:${WRIGHTTEST_VERSION:-0.2.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOVNC_HOST_PORT:-6080}:6080"
    environment:
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
    volumes:
      - x11_socket:/tmp/.X11-unix
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6080/vnc.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: sacha1bu/wrighttest-backend:${WRIGHTTEST_VERSION:-0.2.0}
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        cd backend &&
        node -e "const fs=require('fs');const p='dist/src/queue/worker.js';let s=fs.readFileSync(p,'utf8');const shot='test.name.startsWith(\"misa-advertising\") || index === steps.length - 1 || stepError';s=s.replaceAll('await locator.waitFor({ timeout: 10000 });','await page.addStyleTag({ content: \"*{animation:none!important;transition:none!important}\" }).catch(() => {}); const waitTimeout = step.options?.timeout ?? 10000; if (!step.options?.exact) { await locator.waitFor({ state: \"visible\", timeout: waitTimeout }); break; } await page.waitForFunction(() => Object.keys(localStorage).filter((key) => key.startsWith(\"chats_\")).some((key) => { try { const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const message = chats?.[0]?.messages?.at(-1); return message && message.user !== \"Misa\" && message.deliveryStatus === \"sent\"; } catch { return false; } }), null, { timeout: 15000 }); await new Promise((resolve) => setTimeout(resolve, 1000)); const delivery = await page.evaluate(() => { const key = Object.keys(localStorage).find((item) => item.startsWith(\"chats_\")); const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const resource = performance.getEntriesByType(\"resource\").map((entry) => entry.name).find((url) => url.includes(\"/api/chats/\")); return { chatId: chats?.[0]?.id, token: localStorage.getItem(\"token\"), apiBase: resource ? new URL(resource).origin : null }; }); if (!delivery.chatId || !delivery.token || !delivery.apiBase) throw new Error(\"Misa delivery metadata is unavailable\"); const chatUrl = page.url(); const deadline = Date.now() + waitTimeout; let answered = false; await page.goto(\"about:blank\"); while (Date.now() < deadline) { await new Promise((resolve) => setTimeout(resolve, Math.min(2000, Math.max(0, deadline - Date.now())))); try { const response = await fetch(delivery.apiBase + \"/api/chats/\" + encodeURIComponent(delivery.chatId) + \"/messages/\", { headers: { Authorization: \"Bearer \" + delivery.token } }); const payload = response.ok ? await response.json() : null; const messages = Array.isArray(payload?.data) ? payload.data : []; if (messages.some((message) => message.user === \"Misa\")) { answered = true; break; } } catch {} } if (!answered) throw new Error(\"waitForSelector timed out after \" + waitTimeout + \"ms\"); await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 10000 });').replaceAll('await page.screenshot({ path: screenshotPath });','if ('+shot+') await page.screenshot({ path: screenshotPath, animations: \"disabled\", timeout: 10000 });').replaceAll('screenshots.push(screenshotName);','if ('+shot+') screenshots.push(screenshotName);').replaceAll('screenshot: screenshots[screenshots.length - 1] ?? null','screenshot: ('+shot+') ? screenshots[screenshots.length - 1] ?? null : null').replaceAll('let answered = false; await page.goto','let answered = false; let answerMessages = []; await page.goto').replaceAll('answered = true; break;','answered = true; answerMessages = messages; break;').replaceAll('await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 10000 });','await page.addInitScript(({ chatId, messages }) => { const key = Object.keys(localStorage).find((item) => item.startsWith(\"chats_\")); const chats = JSON.parse(localStorage.getItem(key) || \"[]\"); const index = chats.findIndex((chat) => chat.id === chatId); if (index >= 0) { const chat = { ...chats[index], messages, _messagesLoaded: true }; chats.splice(index, 1); chats.unshift(chat); localStorage.setItem(key, JSON.stringify(chats)); } }, { chatId: delivery.chatId, messages: answerMessages }); await page.goto(chatUrl, { waitUntil: \"domcontentloaded\", timeout: 10000 }); await page.locator(\".misa-message\").last().waitFor({ state: \"visible\", timeout: 5000 });');fs.writeFileSync(p,s)" &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node dist/src/index.js
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      FRONTEND_INTERNAL_URL: http://frontend:80
      SCREENSHOTS_DIR: /app/backend/screenshots
      TRACES_DIR: /app/backend/traces
      AUTH_STATES_DIR: /app/backend/auth-states
      AUTH_STATE_ENCRYPTION_KEY: ${AUTH_STATE_ENCRYPTION_KEY:-}
      DISPLAY: ":99"
      NOVNC_HOST: novnc
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wrighttest.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      NODE_ENV: production
    volumes:
      - screenshots:/app/backend/screenshots
      - traces:/app/backend/traces
      - auth_states:/app/backend/auth-states
      - x11_socket:/tmp/.X11-unix
    depends_on:
      redis:
        condition: service_healthy
      novnc:
        condition: service_healthy
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  frontend:
    image: sacha1bu/wrighttest-frontend:${WRIGHTTEST_VERSION:-0.2.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:?Set VITE_BACKEND_URL in .env}
      VITE_NOVNC_URL: ${VITE_NOVNC_URL:?Set VITE_NOVNC_URL in .env}
      VITE_ENABLE_NOVNC: "true"
    depends_on:
      backend:
        condition: service_healthy

  test-importer:
    image: node:22-alpine
    restart: "no"
    environment:
      WRIGHTTEST_API_URL: http://backend:3000
      WRIGHTTEST_PROJECT: ${WRIGHTTEST_PROJECT:-Misa}
      TEST_BASE_URL: ${TEST_BASE_URL:-https://misa.baxic.ru}
      TEST_SCHEDULE_CRON: "${TEST_SCHEDULE_CRON:-0 * * * *}"
      TEST_ENVIRONMENT: ${TEST_ENVIRONMENT:-Misa Production}
      MISA_TEST_EMAIL: ${MISA_TEST_EMAIL:?Set MISA_TEST_EMAIL in .env}
      MISA_TEST_PASSWORD: ${MISA_TEST_PASSWORD:?Set MISA_TEST_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wrighttest.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./misa-tests:/misa-tests:ro
      - ./scripts/import-tests.mjs:/import-tests.mjs:ro
    command: ["node", "/import-tests.mjs"]
    depends_on:
      backend:
        condition: service_healthy

  misagallery-test-importer:
    image: node:22-alpine
    restart: "no"
    environment:
      WRIGHTTEST_API_URL: http://backend:3000
      WRIGHTTEST_PROJECT: MisaGallery
      TEST_BASE_URL: https://misagallery.baxic.ru
      TEST_API_URL: https://gallery.baxic.ru
      TEST_SCHEDULE_CRON: "${TEST_SCHEDULE_CRON:-0 * * * *}"
      TEST_ENVIRONMENT: MisaGallery Production
      TESTS_DIR: /gallery-tests
      TEST_EMAIL: ${MISA_TEST_EMAIL:?Set MISA_TEST_EMAIL in .env}
      TEST_PASSWORD: ${MISA_TEST_PASSWORD:?Set MISA_TEST_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wrighttest.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./gallery-tests:/gallery-tests:ro
      - ./scripts/import-tests.mjs:/import-tests.mjs:ro
    command: ["node", "/import-tests.mjs"]
    depends_on:
      backend:
        condition: service_healthy

  ecommerce-test-importer:
    image: node:22-alpine
    restart: "no"
    environment:
      WRIGHTTEST_API_URL: http://backend:3000
      WRIGHTTEST_PROJECT: ECommerce
      TEST_BASE_URL: https://ecommerce.baxic.ru
      TEST_API_URL: https://ecommerceapi.baxic.ru
      TEST_SCHEDULE_CRON: "10 * * * *"
      TEST_ENVIRONMENT: ECommerce Production
      TESTS_DIR: /ecommerce-tests
      TEST_LOGIN_PATH: /auth/login
      TEST_REGISTRATION_PATH: /auth/registration
      TEST_FORGOT_PASSWORD_PATH: /auth/forgot-password
      TEST_SHOP_PATH: /shop
      TEST_EMAIL: ${ECOMMERCE_TEST_EMAIL:?Set ECOMMERCE_TEST_EMAIL in .env}
      TEST_PASSWORD: ${ECOMMERCE_TEST_PASSWORD:?Set ECOMMERCE_TEST_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wrighttest.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./ecommerce-tests:/ecommerce-tests:ro
      - ./scripts/import-tests.mjs:/import-tests.mjs:ro
    command: ["node", "/import-tests.mjs"]
    depends_on:
      backend:
        condition: service_healthy

  businesscard-test-importer:
    image: node:22-alpine
    restart: "no"
    environment:
      WRIGHTTEST_API_URL: http://backend:3000
      WRIGHTTEST_PROJECT: BusinessCard
      TEST_BASE_URL: https://baxic.ru
      TEST_API_URL: https://baxicapi.baxic.ru
      TEST_SCHEDULE_CRON: "15 * * * *"
      TEST_ENVIRONMENT: BusinessCard Production
      TESTS_DIR: /businesscard-tests
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wrighttest.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./businesscard-tests:/businesscard-tests:ro
      - ./scripts/import-tests.mjs:/import-tests.mjs:ro
    command: ["node", "/import-tests.mjs"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  screenshots:
  traces:
  auth_states:
  x11_socket:
